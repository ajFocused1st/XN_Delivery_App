<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Xpedite Now LLC</title>
    <link rel="icon" href="assets/images/xpedite-now-logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playball&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#21409A',
                        'brand-orange': '#F15829',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-script { font-family: 'Playball', cursive; }
        .view-container { transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out; }
        .hidden-view {
            opacity: 0;
            transform: scale(0.98);
            pointer-events: none;
            position: absolute;
            top: 2rem;
            left: 2rem;
            right: 2rem;
        }
        .visible-view { opacity: 1; transform: scale(1); }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 relative overflow-hidden">

        <!-- Landing View -->
        <div id="landing-view" class="view-container visible-view">
            <div class="text-center">
                <img src="assets/images/xpedite-now-logo.png" alt="Xpedite Now LLC Logo" class="mx-auto h-32 w-auto mb-2">
                <p class="text-brand-orange font-script text-2xl">Where Speed Meets Reliability</p>
                <p class="mt-2 text-gray-600 font-medium tracking-wide">Your Local Delivery Partner</p>
            </div>

            <div class="mt-10 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="showAuth('customer')" class="group flex flex-col items-center justify-center p-6 bg-gray-50 hover:bg-orange-50 rounded-lg border-2 border-gray-200 hover:border-brand-orange transition-all duration-300">
                        <img src="assets/icons/Customer1.svg" alt="Customer Icon" class="h-20 w-20">
                        <span class="mt-2 font-semibold text-gray-700 group-hover:text-brand-blue">Customer</span>
                    </button>
                    <button onclick="showAuth('driver')" class="group flex flex-col items-center justify-center p-6 bg-gray-50 hover:bg-blue-50 rounded-lg border-2 border-gray-200 hover:border-brand-blue transition-all duration-300">
                        <img src="assets/icons/Driver1.svg" alt="Driver Icon" class="h-20 w-20">
                        <span class="mt-2 font-semibold text-gray-700 group-hover:text-brand-blue">Driver</span>
                    </button>
                </div>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-xs font-semibold text-gray-400 uppercase">Or</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <button onclick="goToQuote()" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-brand-orange hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-orange transition-transform transform hover:scale-105">
                    Get an Instant Quote
                </button>
            </div>
        </div>

        <!-- Auth View -->
        <div id="auth-view" class="view-container hidden-view w-full">
            <button onclick="showLanding()" class="absolute top-4 left-4 text-gray-500 hover:text-gray-800 focus:outline-none z-10">
                <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <div id="auth-container" class="mt-8">
                <div class="flex border-b border-gray-200 mb-6">
                    <button id="login-tab" class="flex-1 py-3 text-center font-semibold text-brand-blue border-b-2 border-brand-blue focus:outline-none" onclick="showLogin()">Login</button>
                    <button id="signup-tab" class="flex-1 py-3 text-center font-semibold text-gray-500 focus:outline-none" onclick="showSignUp()">Sign Up</button>
                </div>
                <div id="form-container">
                    <form id="login-form" class="space-y-6" onsubmit="handleLogin(event)">
                        <h2 class="text-2xl font-bold text-center text-gray-800">Portal Login</h2>
                        <div>
                            <label for="login-email" class="block text-sm font-medium text-gray-700">Email Address</label>
                            <input type="email" id="login-email" name="email" required maxlength="254" autocomplete="email" inputmode="email" spellcheck="false" class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-brand-blue">
                        </div>
                        <div>
                            <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
                            <input type="password" id="login-password" name="password" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-brand-blue">
                        </div>
                        <div>
                            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-brand-blue hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue transition-transform transform hover:scale-105">Login</button>
                        </div>
                    </form>
                    <form id="signup-form" class="space-y-6 hidden" onsubmit="handleSignUp(event)">
                        <h2 class="text-2xl font-bold text-center text-gray-800">Create an Account</h2>
                         <div>
                            <label for="signup-name" class="block text-sm font-medium text-gray-700">Full Name</label>
                            <input type="text" id="signup-name" name="name" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-brand-blue">
                        </div>
                        <div>
                            <label for="signup-email" class="block text-sm font-medium text-gray-700">Email Address</label>
                            <input type="email" id="signup-email" name="email" required maxlength="254" autocomplete="email" inputmode="email" spellcheck="false" class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-brand-blue">
                        </div>
                        <div>
                            <label for="signup-password" class="block text-sm font-medium text-gray-700">Password</label>
                            <input type="password" id="signup-password" name="password" required minlength="6" class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-brand-blue">
                        </div>
                         <div>
                            <label for="user-role" class="block text-sm font-medium text-gray-700">I am a...</label>
                            <select id="user-role" name="role" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-brand-blue">
                                <option value="" disabled>Select your role</option>
                                <option value="customer">Customer</option>
                                <option value="driver">Driver</option>
                            </select>
                        </div>
                        <div>
                            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-brand-blue hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue transition-transform transform hover:scale-105">Create Account</button>
                        </div>
                    </form>
                </div>
                <div id="message-box" class="mt-4 text-center text-sm font-medium"></div>
            </div>
        </div>
    </div>

    <script src="js/email-validation.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const landingView = document.getElementById('landing-view');
        const authView = document.getElementById('auth-view');
        const userRoleSelect = document.getElementById('user-role');
        const messageBox = document.getElementById('message-box');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const loginTab = document.getElementById('login-tab');
        const signupTab = document.getElementById('signup-tab');

        const loggedInUser = window?.XNAuth?.getUser?.();
        if (loggedInUser) {
            showMessage(`You are already signed in as ${loggedInUser.name}.`, 'success');
            appendDashboardShortcut(loggedInUser);
        }

        function appendDashboardShortcut(user) {
            if (!landingView) return;
            const actionsContainer = landingView.querySelector('.mt-10.space-y-4');
            if (!actionsContainer || actionsContainer.querySelector('[data-go-dashboard]')) return;
            const wrapper = document.createElement('div');
            wrapper.className = 'flex flex-col gap-2';
            const button = document.createElement('button');
            button.type = 'button';
            button.dataset.goDashboard = 'true';
            button.className = 'w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-brand-blue hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue transition-transform transform hover:scale-105';
            button.textContent = 'Continue to Dashboard';
            button.addEventListener('click', () => window.XNAuth.redirectToDashboard(user.role));
            wrapper.appendChild(button);
            actionsContainer.appendChild(wrapper);
        }

        function showLanding() {
            authView.classList.add('hidden-view');
            authView.classList.remove('visible-view');
            landingView.classList.add('visible-view');
            landingView.classList.remove('hidden-view');
            userRoleSelect.removeAttribute('disabled');
            clearMessage();
        }

        function showAuth(role) {
            landingView.classList.add('hidden-view');
            landingView.classList.remove('visible-view');
            authView.classList.remove('hidden-view');
            authView.classList.add('visible-view');
            userRoleSelect.removeAttribute('disabled');
            if (role) {
                userRoleSelect.value = role;
                userRoleSelect.setAttribute('disabled', 'true');
            }
            showLogin();
        }

        function goToQuote() {
            window.location.href = 'quote.html';
        }

        function showLogin() {
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            loginTab.classList.add('text-brand-blue', 'border-brand-blue');
            loginTab.classList.remove('text-gray-500');
            signupTab.classList.add('text-gray-500');
            signupTab.classList.remove('text-brand-blue', 'border-brand-blue');
            clearMessage();
        }

        function showSignUp() {
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
            signupTab.classList.add('text-brand-blue', 'border-brand-blue');
            signupTab.classList.remove('text-gray-500');
            loginTab.classList.add('text-gray-500');
            loginTab.classList.remove('text-brand-blue', 'border-brand-blue');
            clearMessage();
            userRoleSelect.removeAttribute('disabled');
        }

        function showMessage(text, type = 'error') {
            messageBox.textContent = text;
            messageBox.className = `mt-4 text-center text-sm font-medium ${type === 'success' ? 'text-green-600' : 'text-red-600'}`;
        }

        function clearMessage() {
            messageBox.textContent = '';
            messageBox.className = 'mt-4 text-center text-sm font-medium';
        }

        async function handleSignUp(event) {
            event.preventDefault();
            const submitButton = signupForm.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Creating...';
            showMessage('Creating account...', 'success');

            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const role = userRoleSelect.value;

            try {
                const data = await window.XNAuth.signup({ name, email, password, role });
                const displayName = data?.user?.name || name || 'your account';
                showMessage(data?.message || `Account created successfully for ${displayName}.`, 'success');
                showLogin();
            } catch (error) {
                console.error('Signup error:', error);
                showMessage(error.message || 'Unable to create account. Please try again.');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Create Account';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const submitButton = loginForm.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Logging In...';
            showMessage('Logging in...', 'success');

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const data = await window.XNAuth.login({ email, password });
                const user = data.user;
                window.XNAuth.saveUser(user);
                showMessage(data?.message || `Welcome back, ${user.name}!`, 'success');
                appendDashboardShortcut(user);
                setTimeout(() => window.XNAuth.redirectToDashboard(user.role), 800);
            } catch (error) {
                console.error('Login error:', error);
                showMessage(error.message || 'Unable to log in. Please try again.');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Login';
            }
        }
    </script>

</body>
</html>
