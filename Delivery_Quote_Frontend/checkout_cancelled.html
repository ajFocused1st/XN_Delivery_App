<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout Cancelled</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background:#f8fafc; color:#1f2937; }
    .wrap { max-width: 720px; margin: 12vh auto; background:#fff; border-radius:12px; padding:32px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; color: #7f1d1d; }
    .note { color:#374151; margin: 8px 0 16px; }
    .actions { display:flex; gap:12px; margin-top: 16px; flex-wrap: wrap; }
    a.btn { text-decoration:none; padding:10px 16px; border-radius:8px; font-weight:600; display:inline-block; }
    .primary { background:#1f2937; color:#fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Checkout Cancelled</h1>
    <p class="note">Your payment was cancelled or did not complete.</p>
    <div class="actions">
      <a class="btn primary" href="quote.html">Return to Quote</a>
    </div>
  </div>
</body>
</html>
